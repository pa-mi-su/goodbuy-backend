# ===============================
# Core
# ===============================
server.port=8080
spring.application.name=goodbuy-api
# Select profile at runtime via SPRING_PROFILES_ACTIVE (dev|prod)

# ===============================
# Management / Health
# ===============================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.defaults.enabled=true
management.info.env.enabled=true

# ===============================
# External configuration import
# Prefer Docker secrets; fallback to classpath for local dev.
# ===============================
spring.config.import=\
  optional:file:/run/secrets/app-secrets.properties,\
  optional:file:/run/secrets/db-secrets.properties,\
  optional:classpath:application-secrets.properties

# ===============================
# Catalog
# ===============================
goodbuy.catalog.enabled=true
goodbuy.catalog.provider=eandb
goodbuy.catalog.eandb.base-url=https://ean-db.com/api/v2/product
goodbuy.catalog.eandb.connect-timeout-ms=3000
goodbuy.catalog.eandb.read-timeout-ms=4000
goodbuy.catalog.fallback.enabled=false

# ===============================
# Logging (baseline)
# Fine-tune in profile files.
# ===============================
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.app.goodbuy.catalog=INFO
logging.level.app.goodbuy.catalog.eandb=INFO

# Wire datasource from env/props defined in .secrets
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB:bpdb}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


# ===============================
# JPA
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ===============================
# Flyway
# ===============================
spring.flyway.enabled=true
spring.flyway.url=${spring.datasource.url}
spring.flyway.user=${spring.datasource.username}
spring.flyway.password=${spring.datasource.password}
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=public
spring.flyway.table=flyway_schema_history
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
