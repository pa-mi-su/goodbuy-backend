# --- Logging (quieter, production, readable by default) ---
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.app.goodbuy=INFO
logging.level.app.goodbuy.catalog=INFO
logging.level.app.goodbuy.catalog.eandb=INFO

# Plain text is default; to enable JSON logs, set LOG_FORMAT=json at runtime
# (no need to touch this file)
# Example:
# SPRING_PROFILES_ACTIVE=prod LOG_FORMAT=json docker compose up -d
logging.config=classpath:logback-spring.xml

# --- Actuator (tight) ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# --- CORS (locked to GoodBuy domains) ---
spring.mvc.cors.allowed-origins=https://goodbuy.app,https://*.goodbuy.app
spring.mvc.cors.allowed-methods=GET,POST
spring.mvc.cors.allowed-headers=Content-Type,Authorization
