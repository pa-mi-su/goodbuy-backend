# ===============================
# PROD PROFILE
# ===============================

# --- Logging (quieter, production, readable by default) ---
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.app.goodbuy=INFO
logging.level.app.goodbuy.catalog=INFO
logging.level.app.goodbuy.catalog.eandb=INFO

# Use shared logback config (supports JSON if LOG_FORMAT=json)
logging.config=classpath:logback-spring.xml

# Do NOT leak stacktraces in prod responses
server.error.include-stacktrace=NEVER

# ===============================
# Actuator (tight)
# ===============================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ===============================
# CORS (locked to GoodBuy domains)
# ===============================
spring.mvc.cors.allowed-origins=https://goodbuy.app,https://*.goodbuy.app
spring.mvc.cors.allowed-methods=GET,POST
spring.mvc.cors.allowed-headers=Content-Type,Authorization

# ===============================
# Secrets loading
# In AWS EB: injected via environment vars or Secrets Manager
# Local / dev fallback: optional file
# ===============================
spring.config.import=\
  optional:file:/run/secrets/app-secrets.properties,\
  optional:file:/run/secrets/db-secrets.properties,\
  optional:file:.secrets/db-secrets.properties

# ===============================
# JPA / Flyway
# ===============================
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true

# ===============================
# S3 storage (GoodBuy PROD)
# ===============================
goodbuy.s3.region=us-east-1
goodbuy.s3.bucket=goodbuy-prod-images
goodbuy.s3.publicBaseUrl=https://goodbuy-prod-images.s3.amazonaws.com

# These MUST come from AWS env/Secrets
goodbuy.s3.accessKey=${GOODBUY_S3_ACCESS_KEY}
goodbuy.s3.secretKey=${GOODBUY_S3_SECRET_KEY}
