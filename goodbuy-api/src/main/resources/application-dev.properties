# --- Logging (more chatty, readable) ---
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.app.goodbuy=DEBUG
logging.level.app.goodbuy.catalog=DEBUG
logging.level.app.goodbuy.catalog.eandb=DEBUG

server.error.include-stacktrace=ALWAYS

# Use the same logback-spring.xml for unified format (plain readable by default)
logging.config=classpath:logback-spring.xml

# Friendly console pattern (keeps reqId in local console)
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} reqId=%X{requestId} - %msg%n

# --- Actuator (fully open for local debugging) ---
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# --- keep your existing logging/actuator/CORS lines ---

# Load secrets file if present (works in dev; harmless if missing)
spring.config.import=optional:file:.secrets/db-secrets.properties

# JPA/Flyway
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true

# --- CORS (wide open for simulators, tools, localhost) ---
spring.mvc.cors.allowed-origins=*
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.mvc.cors.allowed-headers=*

# ===============================
# S3 storage (GoodBuy images)
# ===============================
goodbuy.s3.enabled=${GOODBUY_S3_ENABLED:true}
goodbuy.s3.accessKey=${GOODBUY_DEV_S3_ACCESS_KEY:${GOODBUY_S3_ACCESS_KEY:devkey}}
goodbuy.s3.secretKey=${GOODBUY_DEV_S3_SECRET_KEY:${GOODBUY_S3_SECRET_KEY:devsecret}}

goodbuy.s3.bucket=goodbuy-dev-images
goodbuy.s3.publicBaseUrl=https://s3.amazonaws.com/goodbuy-dev-images

# ===============================
# Magic login configuration (DEV)
# ===============================
goodbuy.auth.magic-login.token-ttl-minutes=15

# ===============================
# Session configuration (DEV)
# ===============================
goodbuy.auth.session.token-ttl-minutes=43200

goodbuy.auth.magic-login.app-link-base=goodbuyapp-dev://magic-login?token=
