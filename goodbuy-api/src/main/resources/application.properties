# ===============================
# Core app settings
# ===============================
server.port=8080
spring.application.name=goodbuy-api
# debug only while verifying bean conditions
# debug=true

# ===============================
# Management / Health endpoints
# ===============================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.defaults.enabled=true
management.info.env.enabled=true

# ===============================
# Internal test endpoints
# ===============================
goodbuy.catalog.test-endpoints=false

# ===============================
# External configuration import (local secrets)
# ===============================
spring.config.import=optional:classpath:application-secrets.properties

# ===============================
# Catalog toggles
# ===============================
goodbuy.catalog.enabled=true
goodbuy.catalog.provider=eandb

# ===============================
# EAN-DB (JWT-based)
# Base is the API path root; client appends /{code}
# ===============================
goodbuy.catalog.eandb.base-url=https://ean-db.com/api/v2/product
goodbuy.catalog.eandb.connect-timeout-ms=3000
goodbuy.catalog.eandb.read-timeout-ms=4000

# ===============================
# Behavior
# ===============================
goodbuy.catalog.fallback.enabled=false  # return 404 if not found

# ===============================
# Logging
# ===============================
logging.level.app.goodbuy.catalog=DEBUG
logging.level.app.goodbuy.catalog.eandb=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
