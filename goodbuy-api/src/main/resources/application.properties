server.port=8080
spring.application.name=goodbuy-api

# Expose only the safe endpoints
management.endpoints.web.exposure.include=health,info

# Make the health endpoint simple (no DB checks yet)
management.endpoint.health.probes.enabled=true
management.health.defaults.enabled=true

# Optional: include build info if build-info goal is used
management.info.env.enabled=true

# --- Catalog provider configuration (bean is DISABLED by default) ---
goodbuy.catalog.enabled=false
goodbuy.catalog.provider=eansearch
goodbuy.catalog.eansearch.base-url=https://www.ean-search.org/api
goodbuy.catalog.eansearch.api-key=${EANSEARCH_API_KEY:dummy}
goodbuy.catalog.eansearch.connect-timeout-ms=3000
goodbuy.catalog.eansearch.read-timeout-ms=4000

