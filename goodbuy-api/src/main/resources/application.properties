server.port=8080
spring.application.name=goodbuy-api

# Expose only the safe endpoints
management.endpoints.web.exposure.include=health,info

# Make the health endpoint simple (no DB checks yet)
management.endpoint.health.probes.enabled=true
management.health.defaults.enabled=true

# Optional: include build info if build-info goal is used
management.info.env.enabled=true
