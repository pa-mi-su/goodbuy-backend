# ===============================
# Core
# ===============================
server.port=8080
spring.application.name=goodbuy-api
# Select profile at runtime via SPRING_PROFILES_ACTIVE (dev|uat|prod)

# ===============================
# Management / Health (shared)
# ===============================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.defaults.enabled=true
management.info.env.enabled=true

# ===============================
# External configuration import
# 1) Docker / Kubernetes secrets (under /run/secrets)
# 2) Local dev .secrets files (gitignored)
# 3) Classpath fallback
# ===============================
spring.config.import=\
  optional:file:/run/secrets/app-secrets.properties,\
  optional:file:/run/secrets/db-secrets.properties,\
  optional:file:.secrets/app-secrets.properties,\
  optional:file:.secrets/db-secrets.properties,\
  optional:classpath:application-secrets.properties

# ===============================
# Catalog (shared)
# ===============================
goodbuy.catalog.enabled=true
goodbuy.catalog.provider=eandb
goodbuy.catalog.eandb.base-url=https://ean-db.com/api/v2/product
goodbuy.catalog.eandb.connect-timeout-ms=3000
goodbuy.catalog.eandb.read-timeout-ms=4000
goodbuy.catalog.fallback.enabled=false

# ===============================
# ? Ingredient auto-enrichment (SYNC on scan)
# ===============================
goodbuy.ingredients.auto-enrich.enabled=true
goodbuy.ingredients.auto-enrich.pubchem.base-url=https://pubchem.ncbi.nlm.nih.gov/rest/pug
goodbuy.ingredients.auto-enrich.pubchem.connect-timeout-ms=800
goodbuy.ingredients.auto-enrich.pubchem.read-timeout-ms=1200
goodbuy.ingredients.auto-enrich.openai.api-url=https://api.openai.com/v1/chat/completions
goodbuy.ingredients.auto-enrich.openai.api-key=${OPENAI_API_KEY:}
goodbuy.ingredients.auto-enrich.openai.model=gpt-4.1-mini
goodbuy.ingredients.auto-enrich.openai.connect-timeout-ms=2000
goodbuy.ingredients.auto-enrich.openai.read-timeout-ms=8000
goodbuy.ingredients.auto-enrich.openai.max-attempts=3
goodbuy.ingredients.auto-enrich.openai.retry-delay-ms=750

# ===============================
# Logging (baseline)
# Fine-tune in profile files (dev/uat/prod).
# ===============================
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.app.goodbuy.catalog=INFO
logging.level.app.goodbuy.catalog.eandb=INFO
logging.level.app.goodbuy.enrichment=INFO

# ===============================
# Datasource (shared)
# Concrete values come from env/secret files:
#   POSTGRES_HOST, POSTGRES_PORT, POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD
# ===============================
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB:bpdb}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA (shared default)
# Each profile (dev/uat/prod) can override ddl-auto if needed.
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ===============================
# Flyway (shared)
# ===============================
spring.flyway.enabled=true
spring.flyway.url=${spring.datasource.url}
spring.flyway.user=${spring.datasource.username}
spring.flyway.password=${spring.datasource.password}
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=public
spring.flyway.table=flyway_schema_history
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# ===============================
# S3 (shared base)
# Per-env buckets + keys handled in profile files.
# ===============================
goodbuy.s3.region=us-east-1

# ===============================
# OCR (shared base)
# provider: none | textract
# ===============================
goodbuy.ocr.provider=${GOODBUY_OCR_PROVIDER:none}
goodbuy.ocr.aws.region=${GOODBUY_OCR_AWS_REGION:${AWS_REGION:us-east-1}}

# ===============================
# Magic login (email-based auth)
# ===============================
goodbuy.auth.magic-login.sender=no-reply@goodbuyapp.com
goodbuy.auth.magic-login.app-name=GoodBuy

# Magic login deep-link for the iOS app
goodbuy.auth.magic-login.app-link-base=goodbuyapp://magic-login?token=
