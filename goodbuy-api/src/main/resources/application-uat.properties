# ===============================
# UAT PROFILE
# ===============================

# --- Logging ---
# Less chatty than dev, more than prod.
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.app.goodbuy=INFO
logging.level.app.goodbuy.catalog=INFO
logging.level.app.goodbuy.catalog.eandb=INFO

# Use common logback config
logging.config=classpath:logback-spring.xml

# Disable stacktraces in UAT responses
server.error.include-stacktrace=NEVER

# --- Actuator ---
# Allow health + info only (not wide open like dev)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# --- Secrets loading ---
spring.config.import=\
  optional:file:/run/secrets/app-secrets.properties,\
  optional:file:/run/secrets/db-secrets.properties,\
  optional:file:.secrets/db-secrets.properties

# --- Database & Flyway ---
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true

# --- CORS ---
# Allow your UAT frontend but NOT everything like dev.
# If your UAT frontend domain is not decided yet, use wildcard temporarily:
spring.mvc.cors.allowed-origins=*
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.mvc.cors.allowed-headers=*

# ===============================
# S3 storage (GoodBuy UAT)
# ===============================
goodbuy.s3.region=us-east-1
goodbuy.s3.bucket=goodbuy-uat-images
goodbuy.s3.publicBaseUrl=https://goodbuy-uat-images.s3.amazonaws.com

# These fall back to defaults unless injected via Secrets Manager / EB env vars
goodbuy.s3.accessKey=${GOODBUY_S3_ACCESS_KEY:uatkey}
goodbuy.s3.secretKey=${GOODBUY_S3_SECRET_KEY:uatsecret}
