name: Backend CI

on:
  push:
    branches: [ dev, uat, prod, main ]
  pull_request:
    branches: [ dev, uat, prod, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build & test with Maven
        run: mvn -B verify
