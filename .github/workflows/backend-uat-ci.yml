name: Backend Deploy (uat)

on:
  push:
    branches: [ uat ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1) Build + test
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build & test with Maven
        run: mvn -B verify

      # 2) Enable linux/amd64 builds on GitHub runner
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3) AWS auth + ECR login
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # 4) Build + push the image to ECR with tag :uat (amd64)
      - name: Build and push Docker image (uat)
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ECR_REPO: ${{ secrets.ECR_REPO }}
        run: |
          IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPO}:uat"
          echo "Building and pushing ${IMAGE_URI}"

          docker buildx build \
            --platform linux/amd64 \
            -t "${IMAGE_URI}" \
            -f goodbuy-api/Dockerfile \
            --push \
            .

      # 5) Create Dockerrun.aws.json (EXACT format)
      - name: Create Dockerrun.aws.json (exact known-good format)
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ECR_REPO: ${{ secrets.ECR_REPO }}
        run: |
          IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPO}:uat"

          printf '{\n' \
          '  "AWSEBDockerrunVersion": "1",\n' \
          '  "Image": {\n' \
          '    "Name": "%s",\n' \
          '    "Update": "true"\n' \
          '  },\n' \
          '  "Ports": [\n' \
          '    {\n' \
          '      "ContainerPort": "8080"\n' \
          '    }\n' \
          '  ]\n' \
          '}\n' \
          "${IMAGE_URI}" > Dockerrun.aws.json

      - name: Show Dockerrun.aws.json
        run: cat Dockerrun.aws.json

      - name: Zip Dockerrun for EB
        run: zip -r goodbuy-backend-uat.zip Dockerrun.aws.json

      # Fail fast: prove the secret exists AND the bucket exists
      - name: Debug EB_S3_BUCKET presence (masked)
        run: |
          if [ -z "${{ secrets.EB_S3_BUCKET }}" ]; then
            echo "ERROR: EB_S3_BUCKET secret is EMPTY or not defined"
            exit 1
          else
            echo "EB_S3_BUCKET is set"
          fi


      # 6) Deploy to Elastic Beanstalk via dedicated action (clean)
      - name: Deploy to Elastic Beanstalk (uat)
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          region: ${{ secrets.EB_REGION }}
          application_name: ${{ secrets.EB_APP_NAME_UAT }}
          environment_name: ${{ secrets.EB_ENV_NAME_UAT }}
          version_label: uat-${{ github.sha }}-${{ github.run_number }}
          deployment_package: goodbuy-backend-uat.zip
          existing_bucket_name: ${{ secrets.EB_S3_BUCKET }}
          wait_for_deployment: true
          wait_for_environment_recovery: 30
