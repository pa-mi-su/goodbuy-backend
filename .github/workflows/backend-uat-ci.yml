name: Backend Deploy (uat)

on:
  push:
    branches: [ uat ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build & test with Maven
        run: mvn -B verify

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image (uat)
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION:     ${{ secrets.AWS_REGION }}
          ECR_REPO:       ${{ secrets.ECR_REPO }}
        run: |
          set -euo pipefail

          IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPO}:uat"
          echo "Building and pushing ${IMAGE_URI}"

          docker buildx build \
            --platform linux/amd64 \
            -t "${IMAGE_URI}" \
            -f goodbuy-api/Dockerfile \
            --push \
            .

      - name: Create Dockerrun.aws.json (exact known-good format)
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION:     ${{ secrets.AWS_REGION }}
          ECR_REPO:       ${{ secrets.ECR_REPO }}
        run: |
          set -euo pipefail

          IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPO}:uat"

          printf '{\n' \
          '  "AWSEBDockerrunVersion": "1",\n' \
          '  "Image": {\n' \
          '    "Name": "%s",\n' \
          '    "Update": "true"\n' \
          '  },\n' \
          '  "Ports": [\n' \
          '    {\n' \
          '      "ContainerPort": "8080"\n' \
          '    }\n' \
          '  ]\n' \
          '}\n' \
          "${IMAGE_URI}" > Dockerrun.aws.json

      - name: Show + validate Dockerrun.aws.json (prevents truncated JSON reaching EB)
        run: |
          set -euo pipefail
          echo "---- Dockerrun.aws.json ----"
          cat Dockerrun.aws.json
          echo "---- JSON validation ----"
          python -m json.tool Dockerrun.aws.json > /dev/null
          echo "Dockerrun JSON is valid."
          echo "Size:"
          wc -c Dockerrun.aws.json

      - name: Zip Dockerrun for EB
        run: |
          set -euo pipefail
          rm -f goodbuy-backend-uat.zip
          zip -r goodbuy-backend-uat.zip Dockerrun.aws.json
          echo "---- Zip contents ----"
          unzip -l goodbuy-backend-uat.zip

      # ✅ Deploy using AWS CLI (EB uses its own service role; no S3 bucket hardening calls)
      - name: Deploy to Elastic Beanstalk (uat) via AWS CLI
        env:
          EB_APP_NAME:   ${{ secrets.EB_APP_NAME_UAT }}
          EB_ENV_NAME:   ${{ secrets.EB_ENV_NAME_UAT }}
          EB_S3_BUCKET:  ${{ secrets.EB_S3_BUCKET }}
          VERSION_LABEL: uat-${{ github.sha }}-${{ github.run_number }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail

          echo "VERSION_LABEL=${VERSION_LABEL}"

          aws s3 cp goodbuy-backend-uat.zip "s3://${EB_S3_BUCKET}/${VERSION_LABEL}.zip"

          # If version already exists (rerun), do NOT fail the job.
          if aws elasticbeanstalk describe-application-versions \
              --application-name "${EB_APP_NAME}" \
              --version-labels "${VERSION_LABEL}" \
              --query "ApplicationVersions[0].VersionLabel" \
              --output text | grep -q "${VERSION_LABEL}"; then
            echo "EB version already exists, skipping create-application-version"
          else
            aws elasticbeanstalk create-application-version \
              --application-name "${EB_APP_NAME}" \
              --version-label "${VERSION_LABEL}" \
              --source-bundle S3Bucket="${EB_S3_BUCKET}",S3Key="${VERSION_LABEL}.zip"
          fi

          aws elasticbeanstalk update-environment \
            --environment-name "${EB_ENV_NAME}" \
            --version-label "${VERSION_LABEL}"
