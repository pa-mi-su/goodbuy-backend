name: Backend Deploy (dev)

on:
  push:
    branches: [ dev ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build & test with Maven
        run: mvn -B verify

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image (dev)
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ECR_REPO: ${{ secrets.ECR_REPO }}
        run: |
          set -euo pipefail

          IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPO}:dev"
          echo "Building and pushing ${IMAGE_URI}"

          docker buildx build \
            --platform linux/amd64 \
            -t "${IMAGE_URI}" \
            -f goodbuy-api/Dockerfile \
            --push \
            .

      - name: Create Dockerrun.aws.json (known-good, literal)
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ECR_REPO: ${{ secrets.ECR_REPO }}
        run: |
          set -euo pipefail

          IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPO}:dev"

          cat > Dockerrun.aws.json <<'EOF'
          {
            "AWSEBDockerrunVersion": "1",
            "Image": {
              "Name": "__IMAGE_URI__",
              "Update": "true"
            },
            "Ports": [
              {
                "ContainerPort": "8080"
              }
            ]
          }
          EOF

          sed -i.bak "s|__IMAGE_URI__|${IMAGE_URI}|g" Dockerrun.aws.json
          rm -f Dockerrun.aws.json.bak

      - name: Show + validate Dockerrun.aws.json (prevents bad JSON reaching EB)
        run: |
          set -euo pipefail
          echo "---- Dockerrun.aws.json ----"
          cat Dockerrun.aws.json
          echo "---- JSON validation ----"
          python -m json.tool Dockerrun.aws.json > /dev/null
          echo "Dockerrun JSON is valid."
          echo "Size:"
          wc -c Dockerrun.aws.json

      - name: Zip Dockerrun for EB
        run: |
          set -euo pipefail
          rm -f goodbuy-backend-dev.zip
          zip -r goodbuy-backend-dev.zip Dockerrun.aws.json
          echo "---- Zip contents ----"
          unzip -l goodbuy-backend-dev.zip

      - name: Deploy to Elastic Beanstalk (dev) via AWS CLI
        env:
          EB_APP_NAME: ${{ secrets.EB_APP_NAME_DEV }}
          EB_ENV_NAME: ${{ secrets.EB_ENV_NAME_DEV }}
          EB_S3_BUCKET: ${{ secrets.EB_S3_BUCKET }}
          VERSION_LABEL: dev-${{ github.sha }}-${{ github.run_number }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail

          # Put the zip under an app prefix so EB versions always have a real SourceBundle
          S3_KEY="${EB_APP_NAME}/${VERSION_LABEL}.zip"

          echo "VERSION_LABEL=${VERSION_LABEL}"
          echo "Uploading ZIP to s3://${EB_S3_BUCKET}/${S3_KEY}"

          aws s3 cp goodbuy-backend-dev.zip "s3://${EB_S3_BUCKET}/${S3_KEY}"

          # If version already exists (rerun), do NOT fail the job.
          if aws elasticbeanstalk describe-application-versions \
              --application-name "${EB_APP_NAME}" \
              --version-labels "${VERSION_LABEL}" \
              --query "ApplicationVersions[0].VersionLabel" \
              --output text | grep -q "${VERSION_LABEL}"; then
            echo "EB version already exists, skipping create-application-version"
          else
            aws elasticbeanstalk create-application-version \
              --application-name "${EB_APP_NAME}" \
              --version-label "${VERSION_LABEL}" \
              --source-bundle S3Bucket="${EB_S3_BUCKET}",S3Key="${S3_KEY}"
          fi

          aws elasticbeanstalk update-environment \
            --environment-name "${EB_ENV_NAME}" \
            --version-label "${VERSION_LABEL}"

          # Force the workflow to fail if EB doesn't actually apply the version
          aws elasticbeanstalk wait environment-updated --environment-names "${EB_ENV_NAME}"

          echo "Current environment version:"
          aws elasticbeanstalk describe-environments \
            --environment-names "${EB_ENV_NAME}" \
            --query "Environments[0].VersionLabel" \
            --output text
