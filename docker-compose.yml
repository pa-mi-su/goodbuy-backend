services:
  postgres:
    image: postgres:16-alpine
    container_name: bp-postgres
    env_file:
      - ./.secrets/db-secrets.properties   # POSTGRES_DB/USER/PASSWORD live here
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  goodbuy-api:
    build:
      context: .
      dockerfile: goodbuy-api/Dockerfile
    image: goodbuy-api:local
    environment:
      SPRING_APPLICATION_NAME: goodbuy-api
      SERVER_PORT: "8080"
      # default to dev when not explicitly set
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 120s
      timeout: 3s
      retries: 20
      start_period: 15s
    ports:
      - "8080:8080"
    restart: unless-stopped
    secrets:
      - source: app_secrets
        target: app-secrets.properties
      - source: db_secrets
        target: db-secrets.properties

volumes:
  pgdata:

secrets:
  app_secrets:
    file: .secrets/app-secrets.properties
  db_secrets:
    file: .secrets/db-secrets.properties
